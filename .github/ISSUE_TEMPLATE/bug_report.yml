name: Bug report
description: Something in Redhot doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Cmd+Shift+Space
        2. Type ...
    validations:
      required: true
  - type: input
    id: redhot
    attributes:
      label: Redhot version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`
    validations:
      required: true
  - type: dropdown
    id: terminal
    attributes:
      label: Terminal
      options: [Terminal, Ghostty]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `redhot logs` around the problem. Logs never contain search text or clipboard content.
      render: text
