name: Feature request
description: Suggest something Redhot could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task or annoyance behind the idea.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like Redhot to do
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How you do it today
      description: Another launcher, a script, or a workaround.
